# Inside the web container. The host nginx terminates TLS and forwards by Host header.
map $http_host $site { default miniapp; ~^admin\. admin; }
server {
  listen 80;
  client_max_body_size 10m;
  root /srv/$site;
  location ~ ^/(api|admin/api|ai|internal|health)(/|$) {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
